name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      - run: swift build -c release
      - run: python3 scripts/sbom.py .build/release/EventHorizon build/EventHorizon.sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: build/EventHorizon.sbom.cdx.json
